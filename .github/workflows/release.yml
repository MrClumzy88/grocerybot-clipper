name: Release

# Push a tag like v0.6.0 (matching manifest.json's version) to publish a
# release with a ready-to-install ZIP. The popup's "Update available" notice
# reads the latest release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - name: Tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version"; exit 1; }
      - name: Build ZIP
        run: |
          mkdir -p dist/grocerybot-clipper
          cp -r manifest.json background.js stores.js popup.html popup.css popup.js content README.md LICENSE dist/grocerybot-clipper/
          (cd dist && zip -r "grocerybot-clipper-$GITHUB_REF_NAME.zip" grocerybot-clipper)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/grocerybot-clipper-$GITHUB_REF_NAME.zip" --title "GroceryBot Clipper $GITHUB_REF_NAME" --generate-notes
